<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktivt Verdens- og Landkart</title>
<script>
  // Hindrer krasj fra biblioteker som forventer Node.js sin process-variabel
  window.process = { env: { NODE_ENV: 'production' } };
</script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script>
    window.tailwind = { config: { suppressWarnings: true } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- style.css -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-900 text-gray-100 flex flex-col h-screen overflow-hidden font-sans">

  <div class="relative flex-1 flex overflow-hidden">

    <!-- Sidelinje + Flaggremse (Samlet i en flex-wrapper) -->
    <aside id="sidebar" class="absolute md:relative top-0 left-0 h-full z-30 flex -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shadow-2xl">
      
      <!-- Hovedmeny -->
      <div class="w-80 bg-gray-900/95 backdrop-blur-md border-r border-gray-800 flex flex-col h-full">
        
        <!-- Sidelinje Header -->
        <div class="px-4 py-3 border-b border-gray-800 flex justify-between items-center bg-gray-950/60 shrink-0">
          <div>
            <h1 class="text-lg font-bold text-sky-400 flex items-center gap-2 leading-none">
              <i class="fa-solid fa-earth-americas text-sky-400"></i> Verdenskart
            </h1>
            <p class="text-xs text-gray-400 mt-1">Utforsk verden, kontinenter & land</p>
          </div>
          <button id="toggleSidebarBtn" class="md:hidden text-gray-400 hover:text-white p-1">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <!-- Innhold i menyen -->
        <div class="flex-1 overflow-y-auto p-3 space-y-3 text-xs">

<!-- Vis 3D Jordklode Knapp -->
<button id="openGlobeBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-3 rounded-xl shadow transition flex items-center justify-center gap-2 text-xs">
  <i class="fa-solid fa-globe"></i> Åpne 3D-Jordklode
</button>

          <!-- Vis Hele Verden knapp (OPPDATERT: Skjuler 3D-overlayet ved klikk) -->
          <button id="resetWorldBtn" onclick="document.getElementById('globeOverlay').classList.add('hidden');" class="w-full bg-gradient-to-r from-sky-600 to-blue-700 hover:from-sky-500 hover:to-blue-600 text-white font-medium py-2 px-3 rounded-xl shadow transition flex items-center justify-center gap-2 text-xs">
            <i class="fa-solid fa-map-location-dot"></i> Vis hele 2D-kartet
          </button>

          <!-- Velg Kontinent (SVG-kart via iframe) -->
          <div>
            <h2 class="text-[11px] uppercase font-semibold text-gray-400 tracking-wider mb-1.5 flex items-center gap-1.5">
              <i class="fa-solid fa-layer-group"></i> Velg Kontinent
            </h2>

            <div class="w-full h-44 bg-gray-950 rounded-xl border border-gray-800 overflow-hidden">
              <iframe 
                src="verdensdel.html" 
                class="w-full h-full border-0"
                title="Verdensdelkart">
              </iframe>
            </div>
          </div>

          <!-- KNAPPENE UNDER KARTET -->
          <div class="grid grid-cols-2 gap-1.5" id="continentButtons">
            <button data-continent="north-america" data-id="PatchCollection_1" class="continent-btn bg-gray-800 hover:bg-gray-700 text-left px-2 py-1 rounded border border-gray-700 text-xs font-medium transition flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full shrink-0" style="background:#00c900"></span> Nord-Amerika
            </button>
            <button data-continent="south-america" data-id="PatchCollection_2" class="continent-btn bg-gray-800 hover:bg-gray-700 text-left px-2 py-1 rounded border border-gray-700 text-xs font-medium transition flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full shrink-0" style="background:#008a16"></span> Sør-Amerika
            </button>
            <button data-continent="europe" data-id="PatchCollection_3" class="continent-btn bg-gray-800 hover:bg-gray-700 text-left px-2 py-1 rounded border border-gray-700 text-xs font-medium transition flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full shrink-0" style="background:#c90000"></span> Europa
            </button>
            <button data-continent="asia" data-id="PatchCollection_4" class="continent-btn bg-gray-800 hover:bg-gray-700 text-left px-2 py-1 rounded border border-gray-700 text-xs font-medium transition flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full shrink-0" style="background:#ff3b0a"></span> Asia
            </button>
            <button data-continent="africa" data-id="PatchCollection_5" class="continent-btn bg-gray-800 hover:bg-gray-700 text-left px-2 py-1 rounded border border-gray-700 text-xs font-medium transition flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full shrink-0" style="background:#ffd42a"></span> Afrika
            </button>
            <button data-continent="oceania" data-id="PatchCollection_6" class="continent-btn bg-gray-800 hover:bg-gray-700 text-left px-2 py-1 rounded border border-gray-700 text-xs font-medium transition flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full shrink-0" style="background:#c23d82"></span> Oseania
            </button>
            <button data-continent="antarctica" data-id="PatchCollection_7" class="continent-btn bg-gray-800 hover:bg-gray-700 text-left px-2 py-1 rounded border border-gray-700 text-xs font-medium transition flex items-center gap-1.5 col-span-2">
              <span class="w-2 h-2 rounded-full shrink-0" style="background:#1645e8"></span> Antarktis
            </button>
          </div>

          <!-- Søk & Velg Land -->
          <div>
            <h2 class="text-[11px] uppercase font-semibold text-gray-400 tracking-wider mb-1.5 flex items-center gap-1.5">
              <i class="fa-solid fa-magnifying-glass"></i> Søk & Velg Land
            </h2>
            <div class="space-y-1.5">
              <div class="relative">
                <input type="text" id="countrySearch" placeholder="Søk etter land..." class="w-full bg-gray-800 text-xs rounded-lg pl-8 pr-3 py-1.5 border border-gray-700 focus:outline-none focus:border-sky-500 text-white placeholder-gray-500">
                <i class="fa-solid fa-search absolute left-2.5 top-2.5 text-gray-500 text-xs"></i>
              </div>
              <select id="countrySelect" class="w-full bg-gray-800 text-xs rounded-lg p-1.5 border border-gray-700 text-gray-200 focus:outline-none focus:border-sky-500 truncate">
                <option value="">Velg et land fra listen...</option>
              </select>
            </div>
          </div>

          <!-- Kartvisning / Lag-kontroller -->
          <div>
            <h3 class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Visning på kartet</h3>
            <div class="flex items-center justify-between gap-2 bg-gray-800/80 px-3 py-2 rounded-lg border border-gray-700/80 text-xs">
              <label class="flex items-center gap-1.5 text-gray-200 cursor-pointer">
                <input type="checkbox" id="toggleMarkers" checked class="rounded bg-gray-700 border-gray-600 text-sky-500 focus:ring-0 w-3.5 h-3.5">
                <span>Markører</span>
              </label>
              <label class="flex items-center gap-1.5 text-gray-200 cursor-pointer">
                <input type="checkbox" id="toggleBorders" checked class="rounded bg-gray-700 border-gray-600 text-sky-500 focus:ring-0 w-3.5 h-3.5">
                <span>Grenser</span>
              </label>
            </div>
          </div>

          <!-- Informasjonskort for valgt land -->
          <div id="countryCard" class="hidden bg-gray-800/90 border border-gray-700/80 rounded-xl p-3 shadow-lg space-y-2.5">
            <div class="flex items-center gap-2.5 border-b border-gray-700/60 pb-2">
              <span id="countryFlag" class="text-2xl min-w-[2rem] text-center"></span>
              <div class="min-w-0 flex-1">
                <h3 id="countryName" class="font-bold text-sm text-white truncate leading-tight"></h3>
                <p id="countryOfficialName" class="text-[10px] text-gray-400 truncate"></p>
              </div>
            </div>
            
            <div class="grid grid-cols-2 gap-1.5 text-xs">
              <div class="bg-gray-900/60 p-1.5 rounded-lg border border-gray-800/80">
                <span class="text-gray-400 text-[9px] uppercase block leading-none mb-1">Hovedstad</span>
                <span id="countryCapital" class="font-semibold text-gray-200 truncate block"></span>
              </div>
              <div class="bg-gray-900/60 p-1.5 rounded-lg border border-gray-800/80">
                <span class="text-gray-400 text-[9px] uppercase block leading-none mb-1">Befolkning</span>
                <span id="countryPopulation" class="font-semibold text-gray-200 truncate block"></span>
              </div>
              <div class="bg-gray-900/60 p-1.5 rounded-lg border border-gray-800/80">
                <span class="text-gray-400 text-[9px] uppercase block leading-none mb-1">Areal</span>
                <span id="countryArea" class="font-semibold text-gray-200 truncate block"></span>
              </div>
              <div class="bg-gray-900/60 p-1.5 rounded-lg border border-gray-800/80">
                <span class="text-gray-400 text-[9px] uppercase block leading-none mb-1">Valuta</span>
                <span id="countryCurrency" class="font-semibold text-gray-200 truncate block"></span>
              </div>
            </div>

            <!-- Lenke og Vis kun land-knapp -->
            <div class="pt-1 flex items-center justify-between text-xs gap-2 border-t border-gray-700/50">
              <a id="wikiLink" target="_blank" class="text-sky-400 hover:underline flex items-center gap-1 text-xs">
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> Wikipedia
              </a>

<a id="countryDetailsBtn" href="#" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded-lg flex items-center gap-1.5 font-medium transition text-xs shadow">
  <i class="fa-solid fa-circle-info"></i> Vis detaljer
</a>
            </div>
          </div>

        </div> <!-- /Innhold i menyen -->
      </div> <!-- /Hovedmeny -->

      <!-- FLAGGREMSE -->
      <div id="continentFlagsBar" class="hidden h-full w-14 bg-gray-900/95 backdrop-blur-md border-r border-gray-800 overflow-y-auto py-3 px-1.5 flex flex-col items-center gap-2.5 shadow-2xl shrink-0">
      </div>

    </aside>

    <!-- Åpne sidelinje knapp (mobil) -->
    <button id="openSidebarBtn" class="md:hidden absolute top-4 left-4 z-20 bg-gray-900/90 text-white p-3 rounded-xl border border-gray-700 shadow-xl hover:bg-gray-800 transition">
      <i class="fa-solid fa-bars text-lg"></i>
    </button>

    <!-- KARTVISNING -->
    <main class="flex-1 relative">
      <!-- Velg kartmodus knapper -->
      <div class="absolute top-4 right-4 z-[1000] bg-gray-900/90 backdrop-blur-md p-1.5 rounded-xl border border-gray-700 shadow-2xl flex flex-wrap gap-1 text-xs">
        <button data-tile="standard" class="tile-btn active bg-sky-600 text-white px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-map"></i> Standard
        </button>
        <button data-tile="satellite" class="tile-btn bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-satellite"></i> Satellitt
        </button>
        <button data-tile="topo" class="tile-btn bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-mountain font-bold"></i> Terreng
        </button>
      </div>

      <!-- 3D JORDKLODE START-OVERLEGG -->
      <div id="globeOverlay" class="absolute inset-0 z-[2000] bg-gray-950 flex flex-col transition-opacity duration-300">


        <iframe 
          src="jordklode.html" 
          class="w-full h-full border-0"
          title="3D Jordklode">
        </iframe>
      </div>

      <!-- Kartet -->
      <div id="map" class="h-full w-full"></div>
    </main>

  </div>

<!-- Wikipedia Modal -->
<div id="wikiModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center p-4">
  <div class="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-4xl h-[85vh] flex flex-col overflow-hidden shadow-2xl">
    
    <!-- Modal Header -->
    <div class="p-4 bg-gray-800 border-b border-gray-700 flex items-center justify-between">
      <h3 id="wikiModalTitle" class="text-white font-semibold text-lg flex items-center gap-2">
        <i class="fa-brands fa-wikipedia-w"></i> Wikipedia
      </h3>
      <div class="flex items-center gap-2">
        <a id="wikiExternalBtn" href="#" target="_blank" rel="noopener noreferrer" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> Åpne i ny fane
        </a>
        <button id="closeWikiModalBtn" type="button" class="text-gray-400 hover:text-white p-1 rounded-lg text-xl transition">
          &times;
        </button>
      </div>
    </div>

    <!-- Modal Body (Iframe) -->
    <div class="flex-1 bg-white relative">
      <iframe id="wikiIframe" class="w-full h-full border-0" src="about:blank"></iframe>
    </div>

  </div>
</div>

<!-- Land Detaljer Modal -->
<div id="detailsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center p-4">
  <div class="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-5xl h-[90vh] flex flex-col overflow-hidden shadow-2xl">
    
    <!-- Modal Header -->
    <div class="p-4 bg-gray-800 border-b border-gray-700 flex items-center justify-between">
      <h3 id="detailsModalTitle" class="text-white font-semibold text-lg flex items-center gap-2">
        <i class="fa-solid fa-circle-info text-emerald-400"></i> Landdetaljer
      </h3>
      <div class="flex items-center gap-2">
        <a id="detailsExternalBtn" href="#" target="_blank" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> Åpne i ny fane
        </a>
        <button id="closeDetailsModalBtn" type="button" class="text-gray-400 hover:text-white p-1 rounded-lg text-xl transition">
          &times;
        </button>
      </div>
    </div>

    <!-- Modal Body (Iframe) -->
    <div class="flex-1 bg-white relative">
      <iframe id="detailsIframe" class="w-full h-full border-0" src="about:blank"></iframe>
    </div>

  </div>
</div>

  <!-- Skript -->
  <script src="land_hoved.js"></script>
  <script src="land_navn.js"></script>
  <script src="app.js"></script>
</body>
</html>
