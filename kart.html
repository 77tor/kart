<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktivt Verdens- og Landkart</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Font Awesome for ikoner -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    #map {
      height: 100vh;
      width: 100%;
      z-index: 1;
    }
    .leaflet-tile {
      filter: inherit;
    }
    /* Tilpassede rullestenger */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1f2937;
    }
    ::-webkit-scrollbar-thumb {
      background: #4b5563;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #6b7280;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen overflow-hidden font-sans">

  <div class="relative flex-1 flex overflow-hidden">

    <!-- Sidelinje / Kontrollpanel -->
    <aside id="sidebar" class="absolute top-0 left-0 h-full w-80 md:w-96 bg-gray-900/95 backdrop-blur-md border-r border-gray-800 z-20 flex flex-col transition-transform duration-300 ease-in-out shadow-2xl">
      
      <!-- Sidelinje Tittel / Header -->
      <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-950/60">
        <div>
          <h1 class="text-xl font-bold text-sky-400 flex items-center gap-2">
            <i class="fa-solid font-bold fa-earth-americas text-sky-400"></i> Verdens kart
          </h1>
          <p class="text-xs text-gray-400">Utforsk verden, kontinenter & land</p>
        </div>
        <button id="toggleSidebarBtn" class="md:hidden text-gray-400 hover:text-white p-2">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Innhold med rullestang -->
      <div class="flex-1 overflow-y-auto p-4 space-y-6">

        <!-- Vis Hele Verden knapp -->
        <button id="resetWorldBtn" class="w-full bg-gradient-to-r from-sky-600 to-blue-700 hover:from-sky-500 hover:to-blue-600 text-white font-medium py-2.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-globe"></i> Vis hele verden
        </button>

        <!-- Velg Kontinent -->
        <div>
          <h2 class="text-xs uppercase font-semibold text-gray-400 tracking-wider mb-2 flex items-center gap-2">
            <i class="fa-solid fa-layer-group"></i> Velg Kontinent
          </h2>
          <div class="grid grid-cols-2 gap-2" id="continentButtons">
            <button data-continent="europe" class="continent-btn bg-gray-800 hover:bg-gray-700 text-left p-2.5 rounded-lg border border-gray-700 text-sm font-medium transition flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-blue-500"></span> Europa
            </button>
            <button data-continent="asia" class="continent-btn bg-gray-800 hover:bg-gray-700 text-left p-2.5 rounded-lg border border-gray-700 text-sm font-medium transition flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-amber-500"></span> Asia
            </button>
            <button data-continent="africa" class="continent-btn bg-gray-800 hover:bg-gray-700 text-left p-2.5 rounded-lg border border-gray-700 text-sm font-medium transition flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Afrika
            </button>
            <button data-continent="north-america" class="continent-btn bg-gray-800 hover:bg-gray-700 text-left p-2.5 rounded-lg border border-gray-700 text-sm font-medium transition flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-rose-500"></span> Nord-Amerika
            </button>
            <button data-continent="south-america" class="continent-btn bg-gray-800 hover:bg-gray-700 text-left p-2.5 rounded-lg border border-gray-700 text-sm font-medium transition flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-purple-500"></span> Sør-Amerika
            </button>
            <button data-continent="oceania" class="continent-btn bg-gray-800 hover:bg-gray-700 text-left p-2.5 rounded-lg border border-gray-700 text-sm font-medium transition flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-teal-500"></span> Oseania
            </button>
            <button data-continent="antarctica" class="continent-btn bg-gray-800 hover:bg-gray-700 text-left p-2.5 rounded-lg border border-gray-700 text-sm font-medium transition flex items-center gap-2 col-span-2">
              <span class="w-2 h-2 rounded-full bg-cyan-300"></span> Antarktis
            </button>
          </div>
        </div>

        <!-- Søk & Velg Land -->
        <div>
          <h2 class="text-xs uppercase font-semibold text-gray-400 tracking-wider mb-2 flex items-center gap-2">
            <i class="fa-solid fa-magnifying-glass"></i> Søk & Velg Land
          </h2>
          
          <div class="relative mb-3">
            <input type="text" id="countrySearch" placeholder="Søk etter land..." class="w-full bg-gray-800 text-sm rounded-lg pl-9 pr-4 py-2 border border-gray-700 focus:outline-none focus:border-sky-500 text-white placeholder-gray-500">
            <i class="fa-solid fa-search absolute left-3 top-2.5 text-gray-500 text-xs"></i>
          </div>

          <select id="countrySelect" class="w-full bg-gray-800 text-sm rounded-lg p-2.5 border border-gray-700 text-gray-200 focus:outline-none focus:border-sky-500">
            <option value="">Velg et land fra listen...</option>
          </select>
        </div>

        <!-- Informasjonskort for valgt land -->
        <div id="countryCard" class="hidden bg-gray-800/80 border border-gray-700/80 rounded-xl p-4 shadow-lg space-y-3">
          <div class="flex items-center gap-3 border-b border-gray-700 pb-3">
            <span id="countryFlag" class="text-4xl shadow-sm rounded overflow-hidden"></span>
            <div>
              <h3 id="countryName" class="font-bold text-lg text-white"></h3>
              <p id="countryOfficialName" class="text-xs text-gray-400"></p>
            </div>
          </div>
          
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="bg-gray-900/50 p-2 rounded border border-gray-800">
              <span class="text-gray-400 block">Hovedstad</span>
              <span id="countryCapital" class="font-semibold text-gray-200"></span>
            </div>
            <div class="bg-gray-900/50 p-2 rounded border border-gray-800">
              <span class="text-gray-400 block">Befolkning</span>
              <span id="countryPopulation" class="font-semibold text-gray-200"></span>
            </div>
            <div class="bg-gray-900/50 p-2 rounded border border-gray-800">
              <span class="text-gray-400 block">Areal</span>
              <span id="countryArea" class="font-semibold text-gray-200"></span>
            </div>
            <div class="bg-gray-900/50 p-2 rounded border border-gray-800">
              <span class="text-gray-400 block">Valuta</span>
              <span id="countryCurrency" class="font-semibold text-gray-200"></span>
            </div>
          </div>

          <div class="pt-2 flex justify-between items-center text-xs">
            <a id="wikiLink" target="_blank" class="text-sky-400 hover:underline flex items-center gap-1">
              <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> Les på Wikipedia
            </a>
          </div>
        </div>

      </div>

      <!-- Sidelinje Footer -->
      <div class="p-3 border-t border-gray-800 text-center text-xs text-gray-500 bg-gray-950/60">
        Kart-feeder fra pålitelige åpne kilder
      </div>
    </aside>

    <!-- Åpne sidelinje knapp (på mobil/skjermer) -->
    <button id="openSidebarBtn" class="absolute top-4 left-4 z-10 bg-gray-900/90 text-white p-3 rounded-xl border border-gray-700 shadow-xl hover:bg-gray-800 transition">
      <i class="fa-solid fa-bars text-lg"></i>
    </button>

    <!-- KARTVISNING -->
    <main class="flex-1 relative">
      <!-- Velg kartmodus knappene (Top-right) -->
      <div class="absolute top-4 right-4 z-[1000] bg-gray-900/90 backdrop-blur-md p-1.5 rounded-xl border border-gray-700 shadow-2xl flex flex-wrap gap-1 text-xs">
        <button data-tile="standard" class="tile-btn active bg-sky-600 text-white px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-map"></i> Standard
        </button>
        <button data-tile="satellite" class="tile-btn bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-satellite"></i> Satellitt
        </button>
        <button data-tile="topo" class="tile-btn bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-mountain font-bold"></i> Terreng
        </button>
        <button data-tile="dark" class="tile-btn bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-moon"></i> Mørk
        </button>
        <button data-tile="light" class="tile-btn bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-sun"></i> Lys
        </button>
      </div>

      <!-- Kartet -->
      <div id="map"></div>
    </main>

  </div>

  <!-- SCRIPT -->
  <script>
    // Innebygd database som garantert fungerer selv om API blir blokkert på file:// protocol
    const LOCAL_COUNTRIES = [
      { name: "Norge", officialName: "Kongeriket Norge", capital: "Oslo", population: "5,4 million", area: "385 207 km²", currency: "NOK (kr)", flag: "🇳🇴", lat: 60.472, lng: 8.468, continent: "europe", wiki: "https://no.wikipedia.org/wiki/Norge" },
      { name: "Sverige", officialName: "Konungariket Sverige", capital: "Stockholm", population: "10.4 million", area: "450 295 km²", currency: "SEK (kr)", flag: "🇸🇪", lat: 60.128, lng: 18.643, continent: "europe", wiki: "https://no.wikipedia.org/wiki/Sverige" },
      { name: "Danmark", officialName: "Kongeriget Danmark", capital: "København", population: "5.8 million", area: "42 933 km²", currency: "DKK (kr)", flag: "🇩🇰", lat: 56.263, lng: 9.501, continent: "europe", wiki: "https://no.wikipedia.org/wiki/Danmark" },
      { name: "Storbritannia", officialName: "United Kingdom", capital: "London", population: "67.3 million", area: "242 495 km²", currency: "GBP (£)", flag: "🇬🇧", lat: 55.378, lng: -3.435, continent: "europe", wiki: "https://no.wikipedia.org/wiki/Storbritannia" },
      { name: "Tyskland", officialName: "Bundesrepublik Deutschland", capital: "Berlin", population: "83.2 million", area: "357 022 km²", currency: "EUR (€)", flag: "🇩🇪", lat: 51.165, lng: 10.451, continent: "europe", wiki: "https://no.wikipedia.org/wiki/Tyskland" },
      { name: "Frankrike", officialName: "République française", capital: "Paris", population: "67.7 million", area: "551 695 km²", currency: "EUR (€)", flag: "🇫🇷", lat: 46.227, lng: 2.213, continent: "europe", wiki: "https://no.wikipedia.org/wiki/Frankrike" },
      { name: "Spania", officialName: "Reino de España", capital: "Madrid", population: "47.4 million", area: "505 990 km²", currency: "EUR (€)", flag: "🇪🇸", lat: 40.463, lng: -3.749, continent: "europe", wiki: "https://no.wikipedia.org/wiki/Spania" },
      { name: "Italia", officialName: "Repubblica Italiana", capital: "Roma", population: "59.1 million", area: "301 340 km²", currency: "EUR (€)", flag: "🇮🇹", lat: 41.871, lng: 12.567, continent: "europe", wiki: "https://no.wikipedia.org/wiki/Italia" },
      { name: "USA", officialName: "United States of America", capital: "Washington, D.C.", population: "331.9 million", area: "9 833 517 km²", currency: "USD ($)", flag: "🇺🇸", lat: 37.090, lng: -95.712, continent: "north-america", wiki: "https://no.wikipedia.org/wiki/USA" },
      { name: "Canada", officialName: "Canada", capital: "Ottawa", population: "38.2 million", area: "9 984 670 km²", currency: "CAD ($)", flag: "🇨🇦", lat: 56.130, lng: -106.346, continent: "north-america", wiki: "https://no.wikipedia.org/wiki/Canada" },
      { name: "Brasil", officialName: "República Federativa do Brasil", capital: "Brasília", population: "214.3 million", area: "8 515 767 km²", currency: "BRL (R$)", flag: "🇧🇷", lat: -14.235, lng: -51.925, continent: "south-america", wiki: "https://no.wikipedia.org/wiki/Brasil" },
      { name: "Argentina", officialName: "República Argentina", capital: "Buenos Aires", population: "45.8 million", area: "2 780 400 km²", currency: "ARS ($)", flag: "🇦🇷", lat: -38.416, lng: -63.616, continent: "south-america", wiki: "https://no.wikipedia.org/wiki/Argentina" },
      { name: "Kina", officialName: "People's Republic of China", capital: "Beijing", population: "1.41 billion", area: "9 596 961 km²", currency: "CNY (¥)", flag: "🇨🇳", lat: 35.861, lng: 104.195, continent: "asia", wiki: "https://no.wikipedia.org/wiki/Kina" },
      { name: "Japan", officialName: "Japan", capital: "Tokyo", population: "125.7 million", area: "377 975 km²", currency: "JPY (¥)", flag: "🇯🇵", lat: 36.204, lng: 138.252, continent: "asia", wiki: "https://no.wikipedia.org/wiki/Japan" },
      { name: "India", officialName: "Republic of India", capital: "New Delhi", population: "1.40 billion", area: "3 287 263 km²", currency: "INR (₹)", flag: "🇮🇳", lat: 20.593, lng: 78.962, continent: "asia", wiki: "https://no.wikipedia.org/wiki/India" },
      { name: "Egypt", officialName: "Arab Republic of Egypt", capital: "Kairo", population: "109.3 million", area: "1 002 450 km²", currency: "EGP (£)", flag: "🇪🇬", lat: 26.820, lng: 30.802, continent: "africa", wiki: "https://no.wikipedia.org/wiki/Egypt" },
      { name: "Sør-Afrika", officialName: "Republic of South Africa", capital: "Pretoria", population: "59.3 million", area: "1 221 037 km²", currency: "ZAR (R)", flag: "🇿🇦", lat: -30.559, lng: 22.937, continent: "africa", wiki: "https://no.wikipedia.org/wiki/S%C3%B8r-Afrika" },
      { name: "Australia", officialName: "Commonwealth of Australia", capital: "Canberra", population: "25.6 million", area: "7 692 024 km²", currency: "AUD ($)", flag: "🇦🇺", lat: -25.274, lng: 133.775, continent: "oceania", wiki: "https://no.wikipedia.org/wiki/Australia" },
      { name: "New Zealand", officialName: "New Zealand", capital: "Wellington", population: "5.1 million", area: "268 021 km²", currency: "NZD ($)", flag: "🇳🇿", lat: -40.900, lng: 174.885, continent: "oceania", wiki: "https://no.wikipedia.org/wiki/New_Zealand" },
      { name: "Antarktis", officialName: "Antarctica", capital: "Ingen", population: "1 000 (forskere)", area: "14 000 000 km²", currency: "Ingen", flag: "🇦🇶", lat: -82.862, lng: 135.000, continent: "antarctica", wiki: "https://no.wikipedia.org/wiki/Antarktis" }
    ];

    // PÅLITELIGE KARTLEVERANDØRER (Uten krav om API-nøkler)
    const TILE_LAYERS = {
      standard: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }),
      satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
        maxZoom: 18
      }),
      topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap',
        maxZoom: 17
      }),
      dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 20
      }),
      light: L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 20
      })
    };

    // Kontinent Grenser (Bounding boxes/sentre)
    const CONTINENT_BOUNDS = {
      'europe': { lat: 54.5260, lng: 15.2551, zoom: 4 },
      'asia': { lat: 34.0479, lng: 100.6197, zoom: 3 },
      'africa': { lat: -8.7832, lng: 34.5085, zoom: 3 },
      'north-america': { lat: 54.5260, lng: -105.2551, zoom: 3 },
      'south-america': { lat: -8.7832, lng: -55.4915, zoom: 3 },
      'oceania': { lat: -22.7359, lng: 140.0188, zoom: 4 },
      'antarctica': { lat: -82.8628, lng: 135.0000, zoom: 2 }
    };

    let map;
    let currentTileLayer;
    let markersLayer = L.layerGroup();
    let countriesData = LOCAL_COUNTRIES;

    // Init kart
    function initMap() {
      map = L.map('map', {
        center: [20, 0],
        zoom: 2.5,
        zoomControl: false
      });

      // Legg til zoom-kontroll nede til høyre
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // Sett standard kartflis
      currentTileLayer = TILE_LAYERS.standard;
      currentTileLayer.addTo(map);

      markersLayer.addTo(map);

      // Fyll inn land-listen
      populateCountryDropdown(countriesData);
      renderCountryMarkers(countriesData);
    }

    // Fyll nedtrekksliste
    function populateCountryDropdown(countries) {
      const select = document.getElementById('countrySelect');
      select.innerHTML = '<option value="">Velg et land fra listen...</option>';

      // Sorter alfabetisk
      const sorted = [...countries].sort((a, b) => a.name.localeCompare(b.name, 'no'));

      sorted.forEach((c, index) => {
        const option = document.createElement('option');
        option.value = c.name;
        option.textContent = `${c.flag} ${c.name}`;
        select.appendChild(option);
      });
    }

    // Legg til markører på kartet
    function renderCountryMarkers(countries) {
      markersLayer.clearLayers();

      countries.forEach(country => {
        const marker = L.marker([country.lat, country.lng], {
          title: country.name
        });

        const popupContent = `
          <div class="text-gray-900 font-sans p-1">
            <h3 class="font-bold text-base flex items-center gap-1.5">${country.flag} ${country.name}</h3>
            <p class="text-xs text-gray-600 mt-0.5"><b>Hovedstad:</b> ${country.capital}</p>
            <p class="text-xs text-gray-600"><b>Befolkning:</b> ${country.population}</p>
            <button onclick="selectCountryByName('${country.name}')" class="mt-2 w-full bg-sky-600 hover:bg-sky-700 text-white text-xs py-1 px-2 rounded font-medium transition">
              Vis informasjon
            </button>
          </div>
        `;

        marker.bindPopup(popupContent);
        markersLayer.addLayer(marker);
      });
    }

    // Velg land og fyll kort
    window.selectCountryByName = function(name) {
      const country = countriesData.find(c => c.name.toLowerCase() === name.toLowerCase());
      if (!country) return;

      // Panorer kartet mykt
      map.flyTo([country.lat, country.lng], 5, { duration: 1.5 });

      // Vis infokort
      document.getElementById('countryFlag').textContent = country.flag;
      document.getElementById('countryName').textContent = country.name;
      document.getElementById('countryOfficialName').textContent = country.officialName;
      document.getElementById('countryCapital').textContent = country.capital;
      document.getElementById('countryPopulation').textContent = country.population;
      document.getElementById('countryArea').textContent = country.area;
      document.getElementById('countryCurrency').textContent = country.currency;
      document.getElementById('wikiLink').href = country.wiki;

      document.getElementById('countryCard').classList.remove('hidden');
      document.getElementById('countrySelect').value = country.name;
    };

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      initMap();

      // Bytt Kartmodus (Standard, Satellitt, osv)
      document.querySelectorAll('.tile-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const mode = btn.dataset.tile;
          
          document.querySelectorAll('.tile-btn').forEach(b => {
            b.classList.remove('bg-sky-600', 'text-white', 'active');
            b.classList.add('bg-gray-800', 'text-gray-300');
          });

          btn.classList.remove('bg-gray-800', 'text-gray-300');
          btn.classList.add('bg-sky-600', 'text-white', 'active');

          if (map.hasLayer(currentTileLayer)) {
            map.removeLayer(currentTileLayer);
          }
          currentTileLayer = TILE_LAYERS[mode];
          currentTileLayer.addTo(map);
        });
      });

      // Kontinent knapper
      document.querySelectorAll('.continent-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const cont = btn.dataset.continent;
          if (CONTINENT_BOUNDS[cont]) {
            const { lat, lng, zoom } = CONTINENT_BOUNDS[cont];
            map.flyTo([lat, lng], zoom, { duration: 1.5 });
          }
        });
      });

      // Vis Hele Verden
      document.getElementById('resetWorldBtn').addEventListener('click', () => {
        map.flyTo([20, 0], 2.5, { duration: 1.5 });
        document.getElementById('countryCard').classList.add('hidden');
        document.getElementById('countrySelect').value = "";
      });

      // Land valgt fra drop-down
      document.getElementById('countrySelect').addEventListener('change', (e) => {
        if (e.target.value) {
          selectCountryByName(e.target.value);
        }
      });

      // Søk i land-listen
      document.getElementById('countrySearch').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = countriesData.filter(c => c.name.toLowerCase().includes(query));
        populateCountryDropdown(filtered);
      });

      // Mobil Sidelinje Toggle
      const sidebar = document.getElementById('sidebar');
      document.getElementById('openSidebarBtn').addEventListener('click', () => {
        sidebar.classList.remove('-translate-x-full');
      });
      document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
        sidebar.classList.add('-translate-x-full');
      });
    });
  </script>
</body>
</html>
