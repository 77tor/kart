<style>
    /* 1. Tilpass bakgrunnen for iframe (mørk/gjennomsiktig og uten padding) */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent; /* Slår ut den hvit/lyse bakgrunnen */
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    * { box-sizing: border-box; }

    /* 2. Skjul alt av tekst, overskrifter og knapper slik at KUN kartet vises i menyen */
    h1, 
    .instruction, 
    .legend, 
    .status {
        display: none !important;
    }

    /* 3. Fjern den hvite boks-rammen (.map-card) */
    .page, 
    .map-card {
        width: 100%;
        height: 100%;
        background: transparent !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        border-radius: 0 !important;
    }

    .map-wrap {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .world-map-svg {
        display: block;
        width: 100%;
        height: auto;
        max-height: 100%;
    }

    /* 4. Fjern Matplotlib sine maskeringer og hvite bakgrunnsplater som skjuler kartet */
    .world-map-svg * {
        clip-path: none !important;
    }

    .map-wrap svg #patch_1,
    .map-wrap svg #patch_2,
    .map-wrap svg #text_1,
    .map-wrap svg #text_2,
    .map-wrap svg #text_3,
    .map-wrap svg #text_4,
    .map-wrap svg #text_5,
    .map-wrap svg #text_6,
    .map-wrap svg #text_7,
    .map-wrap svg #patch_3,
    .map-wrap svg #patch_4,
    .map-wrap svg #patch_5,
    .map-wrap svg #patch_6,
    .map-wrap svg #patch_7,
    .map-wrap svg #patch_8 {
        display: none !important;
    }

    /* 5. Kontinent-interaksjon (farger & hover) */
    .continent {
        cursor: pointer;
        outline: none;
        transition: filter .18s ease, opacity .18s ease;
    }

    .continent:hover path,
    .continent:focus-visible path {
        stroke-width: 2.2px !important;
        paint-order: stroke fill;
        stroke: #ffffff !important;
    }

    /* Hover-farger per kontinent */
    #PatchCollection_1:hover path { fill: #55df55 !important; }
    #PatchCollection_2:hover path { fill: #42b957 !important; }
    #PatchCollection_3:hover path { fill: #f04b4b !important; }
    #PatchCollection_4:hover path { fill: #ff8b63 !important; }
    #PatchCollection_5:hover path { fill: #ffe878 !important; }
    #PatchCollection_6:hover path { fill: #df78aa !important; }
    #PatchCollection_7:hover path { fill: #6485ff !important; }

    /* Valgt kontinent */
    .continent.selected path {
        stroke: white !important;
        stroke-width: 3px !important;
        paint-order: stroke fill;
    }

    #PatchCollection_1.selected path { fill: #70e970 !important; }
    #PatchCollection_2.selected path { fill: #62c96f !important; }
    #PatchCollection_3.selected path { fill: #ff6868 !important; }
    #PatchCollection_4.selected path { fill: #ff9b78 !important; }
    #PatchCollection_5.selected path { fill: #ffed92 !important; }
    #PatchCollection_6.selected path { fill: #e58abb !important; }
    #PatchCollection_7.selected path { fill: #7d9aff !important; }
</style>

<script>
// Mapping fra ID til navne-koder som app.js forstår
const continentMap = {
    'PatchCollection_1': { key: 'north-america', name: 'Nord-Amerika' },
    'PatchCollection_2': { key: 'south-america', name: 'Sør-Amerika' },
    'PatchCollection_3': { key: 'europe',        name: 'Europa' },
    'PatchCollection_4': { key: 'asia',          name: 'Asia' },
    'PatchCollection_5': { key: 'africa',        name: 'Afrika' },
    'PatchCollection_6': { key: 'oceania',       name: 'Oseania' },
    'PatchCollection_7': { key: 'antarctica',    name: 'Antarktis' }
};

const continents = document.querySelectorAll('.continent');
const legendItems = document.querySelectorAll('.legend-item');
const statusText = document.getElementById('status');

function selectContinentById(id) {
    const info = continentMap[id];
    if (!info) return;

    // 1. Visuelt marker i SVG-en
    continents.forEach(c => c.classList.remove('selected'));
    const activeContinent = document.getElementById(id);
    if (activeContinent) {
        activeContinent.classList.add('selected');
    }

    // 2. Visuelt marker i tegnforklaringen (om den er synlig)
    legendItems.forEach(b => b.classList.remove('selected'));
    const matchingLegend = document.querySelector(`.legend-item[data-id="${id}"]`);
    if (matchingLegend) {
        matchingLegend.classList.add('selected');
    }

    // 3. Oppdater statustekst
    if (statusText) {
        statusText.textContent = `Du valgte ${info.name}`;
    }

    // 4. Send beskjed ut fra iframe til hovedvinduet (index.html)
    window.parent.postMessage({
        type: 'CONTINENT_SELECTED',
        continentKey: info.key,
        continentName: info.name,
        elementId: id
    }, '*');
}

// Klikk og tastatur-støtte på selve SVG-kontinentene
continents.forEach(continent => {
    continent.addEventListener('click', () => {
        selectContinentById(continent.id);
    });

    continent.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            selectContinentById(continent.id);
        }
    });
});

// Klikk på knappene under kartet
legendItems.forEach(button => {
    button.addEventListener('click', () => {
        const id = button.dataset.id;
        selectContinentById(id);
    });
});
</script>
